<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>diabolicky ♡</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Playfair+Display:wght@500;600&display=swap');

* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: #f8eef1;
  color: #171316;
  font-family: "Cormorant Garamond", Georgia, serif;
}
.page {
  width: min(100%, 720px);
  margin: 0 auto;
  padding: 38px 24px 55px;
  text-align: center;
}
.profile {
  width: 116px;
  height: 116px;
  object-fit: cover;
  border-radius: 50%;
  display: block;
  margin: 0 auto 20px;
  border: 2px solid rgba(255,255,255,.85);
  box-shadow: 0 5px 20px rgba(75,40,52,.10);
}
.name {
  font-family: "Playfair Display", Georgia, serif;
  font-size: 43px;
  line-height: 1;
  margin: 0 0 18px;
  font-weight: 500;
  letter-spacing: .5px;
}
.bio {
  font-size: 21px;
  line-height: 1.25;
  margin-bottom: 28px;
}
.socials {
  display: flex;
  justify-content: center;
  gap: 28px;
  margin: 8px 0 46px;
}
.socials a {
  color: #111;
  text-decoration: none;
  font-family: Arial, sans-serif;
  font-size: 31px;
  font-weight: 600;
}
.links {
  display: grid;
  gap: 24px;
}
.link {
  min-height: 82px;
  padding: 0 24px;
  border-radius: 45px;
  background: rgba(255,255,255,.96);
  color: #171316;
  text-decoration: none;
  display: grid;
  grid-template-columns: 42px 1fr 24px;
  align-items: center;
  box-shadow: 0 6px 18px rgba(83,48,61,.08);
  transition: transform .18s ease, box-shadow .18s ease;
}
.link:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(83,48,61,.13);
}
.link span {
  font-family: Arial, sans-serif;
  font-size: 26px;
}
.link b {
  font-size: 24px;
  font-weight: 600;
  letter-spacing: .2px;
}
.link i {
  font-family: Arial, sans-serif;
  font-size: 25px;
  font-style: normal;
  color: #777;
}
.footer {
  margin-top: 35px;
  font-size: 16px;
  opacity: .65;
}
@media (max-width: 480px) {
  .page { padding: 28px 17px 45px; }
  .name { font-size: 39px; }
  .bio { font-size: 19px; }
  .link { min-height: 74px; }
  .link b { font-size: 22px; }
}
</style>
